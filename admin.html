<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Status Server</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'VT323', monospace;
        }

        body {
            background-color: #111;
            background-image: radial-gradient(#2a2a2a 15%, transparent 16%);
            background-size: 14px 14px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 12px;
        }

        .admin-box {
            width: 100%;
            max-width: 400px;
            background: #222;
            border: 4px solid #fff;
            outline: 4px solid #000;
            padding: 20px;
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-family: 'Press Start 2P', cursive;
            font-size: 13px;
            color: #FF5555;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #FFFF55;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 2px solid #555;
            color: #55FF55;
            font-family: 'VT323', monospace;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
        }

        /* Container Password & Logo Mata */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-eye {
            position: absolute;
            right: 5px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            user-select: none;
        }

        /* Tombol Gaya Minecraft */
        .mc-btn {
            background: #707070;
            color: #fff;
            padding: 12px 10px;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            text-decoration: none;
            border-top: 3px solid #aaa;
            border-left: 3px solid #aaa;
            border-right: 3px solid #333;
            border-bottom: 3px solid #333;
            outline: 2px solid #000;
            cursor: pointer;
            text-shadow: 1px 1px #000;
            width: 100%;
            box-sizing: border-box;
            margin-top: 10px;
        }

        .mc-btn:active {
            border-top: 3px solid #333;
            border-left: 3px solid #333;
            border-right: 3px solid #aaa;
            border-bottom: 3px solid #aaa;
            background: #555;
        }

        .btn-gold {
            background: #AA0000;
            color: #FFFF55;
            border-top-color: #FF5555;
            border-left-color: #FF5555;
        }

        /* Pesan Notifikasi Teks */
        .msg-box {
            margin-top: 10px;
            font-size: 16px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2 class="title">🛡️ ADMIN PANEL SERVER</h2>

        <!-- FORM LOGIN ADMIN -->
        <div id="login-section">
            <div class="form-group">
                <label>MASUKKAN PASSWORD ADMIN:</label>
                <div class="password-wrapper">
                    <input type="password" id="admin-pass" class="form-input" placeholder="Ketik password di sini...">
                    <button type="button" class="toggle-eye" id="eye-btn" onclick="togglePassword()">👁️</button>
                </div>
            </div>
            <button type="button" class="mc-btn btn-gold" id="btn-login" onclick="loginAdmin()">LOG IN</button>
            <div id="login-msg" class="msg-box"></div>
        </div>

        <!-- PANEL KONTROL STATUS (Sembunyi Awalnya) -->
        <div id="control-section" style="display:none;">
            <div class="form-group">
                <label>STATUS SERVER:</label>
                <select id="status-select" class="form-select">
                    <option value="ONLINE">🟢 ONLINE</option>
                    <option value="OFFLINE">🔴 OFFLINE</option>
                    <option value="MAINTENANCE">🟡 MAINTENANCE</option>
                </select>
            </div>

            <div class="form-group">
                <label>JUMLAH PLAYER ONLINE:</label>
                <input type="text" id="player-count" class="form-input" placeholder="Contoh: 15/50">
            </div>

            <div class="form-group">
                <label>PESAN MOTD / ANNOUNCEMENT:</label>
                <input type="text" id="motd-text" class="form-input" placeholder="Contoh: Event Jam 8 Malam!">
            </div>

            <button type="button" class="mc-btn" onclick="saveStatus()" style="background:#55FF55; color:#000; border-color:#88FF88;">💾 SIMPAN PERUBAHAN</button>
            <button type="button" class="mc-btn" onclick="logoutAdmin()" style="border-color:#FF5555; margin-top:8px;">LOGOUT</button>
            <div id="save-msg" class="msg-box"></div>
        </div>
    </div>

    <script>
        // PASSWORD ADMIN
        const ADMIN_PASSWORD = "admin123";

        // Fitur Intip Password (Mata 👁️ / 🙈)
        function togglePassword() {
            var passInput = document.getElementById("admin-pass");
            var eyeBtn = document.getElementById("eye-btn");
            
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeBtn.innerText = "🙈";
            } else {
                passInput.type = "password";
                eyeBtn.innerText = "👁️";
            }
        }

        // Fungsi Login
        function loginAdmin() {
            var passInput = document.getElementById("admin-pass").value;
            var msgBox = document.getElementById("login-msg");

            if (passInput === ADMIN_PASSWORD) {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("control-section").style.display = "block";
                msgBox.style.display = "none";
                loadCurrentStatus();
            } else {
                msgBox.style.display = "block";
                msgBox.style.color = "#FF5555";
                msgBox.innerText = "❌ Password Salah! Coba pakai: admin123";
            }
        }

        // Memuat status dari LocalStorage
        function loadCurrentStatus() {
            try {
                var serverData = JSON.parse(localStorage.getItem("mc_server_status")) || {
                    status: "ONLINE",
                    players: "0/50",
                    motd: "Selamat datang di server!"
                };

                document.getElementById("status-select").value = serverData.status;
                document.getElementById("player-count").value = serverData.players;
                document.getElementById("motd-text").value = serverData.motd;
            } catch (e) {
                console.log(e);
            }
        }

        // Menyimpan Status
        function saveStatus() {
            var statusVal = document.getElementById("status-select").value;
            var playersVal = document.getElementById("player-count").value;
            var motdVal = document.getElementById("motd-text").value;

            var serverData = {
                status: statusVal,
                players: playersVal,
                motd: motdVal
            };

            var saveMsg = document.getElementById("save-msg");

            try {
                localStorage.setItem("mc_server_status", JSON.stringify(serverData));
                saveMsg.style.display = "block";
                saveMsg.style.color = "#55FF55";
                saveMsg.innerText = "✅ Perubahan Berhasil Disimpan!";

                setTimeout(function() {
                    saveMsg.style.display = "none";
                }, 3000);
            } catch (e) {
                saveMsg.style.display = "block";
                saveMsg.style.color = "#FF5555";
                saveMsg.innerText = "❌ Gagal menyimpan!";
            }
        }

        // Logout Admin
        function logoutAdmin() {
            document.getElementById("admin-pass").value = "";
            document.getElementById("admin-pass").type = "password";
            document.getElementById("eye-btn").innerText = "👁️";
            document.getElementById("login-section").style.display = "block";
            document.getElementById("control-section").style.display = "none";
        }

        // Menambahkan listener tombol Enter di keyboard
        document.getElementById("admin-pass").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                loginAdmin();
            }
        });
    </script>
</body>
</html>
